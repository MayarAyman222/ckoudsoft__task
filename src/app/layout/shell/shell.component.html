<div class="shell" [class.shell--collapsed]="collapsed()">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo">SPA</div>
      @if (!collapsed()) {
        <div class="sidebar__brand-text">
          <span class="sidebar__title">CRM</span>
          <span class="sidebar__subtitle">Customer</span>
        </div>
      }
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems; track item.route) {
        <a
          class="sidebar__link"
          [routerLink]="item.route"
          routerLinkActive="sidebar__link--active"
        >
          <i [class]="item.icon"></i>
          @if (!collapsed()) {
            <span>{{ item.label }}</span>
            @if (item.favorite) {
              <i class="pi pi-star-fill sidebar__favorite"></i>
            }
          }
        </a>
      }
    </nav>

    <button class="sidebar__collapse" type="button" (click)="collapsed.set(!collapsed())">
      <i class="pi" [class.pi-angle-left]="!collapsed()" [class.pi-angle-right]="collapsed()"></i>
    </button>
  </aside>

  <div class="shell__main">
    <header class="topbar">
      <div class="topbar__search">
        <i class="pi pi-search"></i>
        <input type="text" placeholder="Search or type a command" />
        <i class="pi pi-microphone"></i>
      </div>
      <div class="topbar__actions">
        <span class="topbar__lang">
          <span class="topbar__flag" aria-hidden="true"></span>
          en
          <i class="pi pi-angle-down"></i>
        </span>
        <i class="pi pi-bell" pBadge severity="danger"></i>
        <i class="pi pi-mobile"></i>
        <i class="pi pi-gift"></i>
        <div class="topbar__user">
          <span class="topbar__avatar">Use</span>
          <span class="topbar__user-text">
            Hello, {{ userName }}!
          </span>
        </div>
      </div>
    </header>

    <main class="shell__content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
